spring.application.name=users-microservice

# Même base PostgreSQL que le projet restaurant (tables : users, role, user_role, verification_token)
spring.datasource.url=jdbc:postgresql://localhost:5432/spring_db
spring.datasource.username=postgres
spring.datasource.password=12345678
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

server.servlet.context-path=/users
server.port=8081
spring.main.allow-circular-references=true

# Envoi des emails (atelier Registration)
# Mettez votre adresse Gmail et un "mot de passe d'application" Gmail
# (Compte Google > Sécurité > Validation en 2 étapes > Mots de passe des applications).
# Tant que ce n'est pas configuré, le code de validation est affiché dans la console Eclipse.
spring.mail.default-encoding=UTF-8
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Adresse et mot de passe Gmail : dans application-secret.properties (non envoyé sur GitHub)
spring.config.import=optional:classpath:application-secret.properties
