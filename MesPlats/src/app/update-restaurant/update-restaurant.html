<form>
  <div [hidden]="ajout">
    <label>Code Restaurant</label>
    <input type="text" [(ngModel)]="restaurant.codeResto" name="codeResto" class="form-control w-25">
  </div>
  <div>
    <label>Enseigne Restaurant</label>
    <input type="text" [(ngModel)]="restaurant.enseigneResto" name="enseigneResto" class="form-control"
      placeholder="Entrez une enseigne de restaurant...">
  </div>
  <div class="mt-2">
    <button type="submit" [disabled]="!restaurant.enseigneResto" class="btn btn-success"
      (click)="saveRestaurant()">{{ ajout ? 'Ajouter' : 'Modifier' }}
    </button>
  </div>
</form>
