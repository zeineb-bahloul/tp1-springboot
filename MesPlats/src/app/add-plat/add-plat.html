<div class="container">

  <div>
    <h2>Ajouter un Plat :</h2>
  </div>

  <form>

    <div class="col-sm-2 col-md-2 col-lg-2">
      <label>Référence Plat</label>
      <input type="number"
        [(ngModel)]="newPlat.referencePlat"
        name="referencePlat"
        class="form-control">
    </div>

    <div class="col-sm-4 col-md-4 col-lg-4">
      <label>Intitulé Plat</label>
      <input type="text"
        [(ngModel)]="newPlat.intitulePlat"
        name="intitulePlat"
        class="form-control">
    </div>

    <div class="col-sm-2 col-md-2 col-lg-2">
      <label>Tarif Plat</label>
      <input type="number"
        [(ngModel)]="newPlat.tarifPlat"
        name="tarifPlat"
        class="form-control">
    </div>

    <div class="col-sm-4 col-md-4 col-lg-4">
      <label>Date d'ajout au menu</label>
      <input type="date"
        [(ngModel)]="newPlat.dateAjoutAuMenu"
        name="dateAjoutAuMenu"
        class="form-control">
    </div>
    <div class="col-sm-4 col-md-4 col-lg-4">
  <label>Restaurant</label>

  <select
    class="form-control form-control-lg"
    id="codeResto"
    name="codeResto"
    [(ngModel)]="newIdResto">

    @for(resto of restaurants; track resto.codeResto) {
      <option [value]="resto.codeResto">
        {{ resto.enseigneResto }}
      </option>
    }

  </select>
</div>

    <div class="mt-2">
      <button type="button"
        (click)="addPlat()"
        class="btn btn-success">
        Ajouter
      </button>
    </div>

  </form>

</div>
